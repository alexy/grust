# Grust backend integration-test launcher config.
#
# This file is sourced by scripts/integration-test.sh. Override any value by
# exporting it in the shell or by editing this file locally.

# Backends to run when no --backend flags are given.
GRUST_INTEGRATION_BACKENDS="${GRUST_INTEGRATION_BACKENDS:-sail surreal falkor helix ladybug lancedb cocoindex pggraph postgres-pgq}"

# If a source checkout exists, the launcher uses it before Docker for these
# backends. Set a path empty to force Docker or an already-running service.
SAIL_SOURCE="${SAIL_SOURCE:-/Users/alexy/src/sail}"
# Optional absolute path to the exact Sail binary under test. When unset, the
# launcher uses SAIL_SOURCE/target/release/sail or the checkout's Hatch env; it
# never substitutes an unrelated `sail` from PATH.
SAIL_TEST_BIN="${SAIL_TEST_BIN:-}"
SURREAL_SOURCE="${SURREAL_SOURCE:-/Users/alexy/src/SurrealDB}"
FALKOR_SOURCE="${FALKOR_SOURCE:-/Users/alexy/src/FalkorDB}"
HELIX_SOURCE="${HELIX_SOURCE:-/Users/alexy/src/HelixDB}"
PGGRAPH_SOURCE="${PGGRAPH_SOURCE:-}"
HELIX_PROJECT_DIR="${HELIX_PROJECT_DIR:-}"

# Connection ports used by Grust backend defaults.
SAIL_HOST="${SAIL_HOST:-127.0.0.1}"
SAIL_PORT="${SAIL_PORT:-50051}"
SURREAL_HOST="${SURREAL_HOST:-127.0.0.1}"
SURREAL_PORT="${SURREAL_PORT:-8000}"
FALKOR_HOST="${FALKOR_HOST:-127.0.0.1}"
FALKOR_PORT="${FALKOR_PORT:-6379}"
HELIX_HOST="${HELIX_HOST:-127.0.0.1}"
HELIX_PORT="${HELIX_PORT:-8080}"
PGGRAPH_HOST="${PGGRAPH_HOST:-127.0.0.1}"
PGGRAPH_PORT="${PGGRAPH_PORT:-55432}"
PGGRAPH_CONNECTION_STRING="${PGGRAPH_CONNECTION_STRING:-host=${PGGRAPH_HOST} port=${PGGRAPH_PORT} user=postgres password=postgres dbname=graph}"
POSTGRES_PGQ_HOST="${POSTGRES_PGQ_HOST:-127.0.0.1}"
POSTGRES_PGQ_PORT="${POSTGRES_PGQ_PORT:-5419}"
POSTGRES_PGQ_PREFIX="${POSTGRES_PGQ_PREFIX:-/opt/homebrew/opt/postgresql@19beta}"
POSTGRES_PGQ_DATA="${POSTGRES_PGQ_DATA:-/opt/homebrew/var/postgresql@19beta}"
POSTGRES_PGQ_CONNECTION_STRING="${POSTGRES_PGQ_CONNECTION_STRING:-host=${POSTGRES_PGQ_HOST} port=${POSTGRES_PGQ_PORT} user=${USER:-postgres} dbname=postgres}"

# Docker image tags for reproducible contributor runs. Override these in the
# environment, or set GRUST_INTEGRATION_IMAGE_CHANNEL=latest to use latest tags.
if [[ "${GRUST_INTEGRATION_IMAGE_CHANNEL:-pinned}" == "latest" ]]; then
  FALKOR_IMAGE="${FALKOR_IMAGE:-falkordb/falkordb:latest}"
  SURREAL_IMAGE="${SURREAL_IMAGE:-surrealdb/surrealdb:latest}"
else
  FALKOR_IMAGE="${FALKOR_IMAGE:-falkordb/falkordb:v4.18.10}"
  SURREAL_IMAGE="${SURREAL_IMAGE:-surrealdb/surrealdb:v3.1}"
fi
PGGRAPH_IMAGE="${PGGRAPH_IMAGE:-ghcr.io/evokoa/pggraph:0.1.7}"

export FALKOR_IMAGE SURREAL_IMAGE PGGRAPH_IMAGE PGGRAPH_PORT
export PGGRAPH_USER="${PGGRAPH_USER:-postgres}"
export PGGRAPH_PASSWORD="${PGGRAPH_PASSWORD:-postgres}"
export PGGRAPH_DB="${PGGRAPH_DB:-graph}"
