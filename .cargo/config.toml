# On macOS 26 (Tahoe), the CLT's top-level C++ include dir only has stubs;
# the full libc++ headers live inside the SDK. Apple clang with
# -mmacosx-version-min=26.x does not automatically search the SDK's
# usr/include/c++/v1, so crates that compile C++ (e.g. cxx, ladybug's bridge)
# fail with '<algorithm> file not found'. Add the SDK C++ path explicitly.
[env]
CXXFLAGS = "-isystem /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk/usr/include/c++/v1"
