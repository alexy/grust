[package]
name = "querygraph-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-safe TypeSec memory and governed cognition over Grust"
# Kept private until the coordinated Marciana crate release is versioned.
publish = false

[features]
default = ["turso"]
turso = ["dep:grust-turso"]
sail = ["dep:arrow", "dep:grust-sail"]

[dependencies]
grust-core = { path = "../grust-core", version = "0.12.1" }
grust-turso = { path = "../grust-turso", version = "0.12.1", optional = true }
grust-sail = { path = "../grust-sail", version = "0.12.1", optional = true }
# The security contract this crate implements against. Pin the reviewed
# TypeSec source so a clean Grust checkout does not require a sibling clone.
typesec-memory = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { workspace = true, features = ["net", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
async-trait = { workspace = true }
arrow = { version = "58.1.0", features = ["ipc_compression"], optional = true }

[dev-dependencies]
grust-memory = { path = "../grust-memory", version = "0.12.1" }
tempfile = { workspace = true }
typesec-memory = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0", features = ["conformance"] }
typesec-core = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0" }
typesec-rbac = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0", default-features = false }
static_assertions = "1"
tokio = { workspace = true, features = ["test-util"] }
