[package]
name = "querygraph-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-safe TypeSec memory over Grust, with durable Turso storage"
# Kept private until the next Grust release makes an explicit distribution
# decision and replaces the sibling TypeSec paths with registry-versioned deps.
publish = false

[features]
default = ["turso"]
turso = ["dep:grust-turso"]

[dependencies]
grust-core = { path = "../grust-core", version = "0.12.0" }
grust-turso = { path = "../grust-turso", version = "0.12.0", optional = true }
# The security contract this crate implements against. Sibling checkout, the
# mirror image of typesec's ../grust path deps; CI checks out both repos.
typesec-memory = { path = "../../../typesec/crates/typesec-memory" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { workspace = true, features = ["net", "time"] }
tracing = "0.1"

[dev-dependencies]
grust-memory = { path = "../grust-memory", version = "0.12.0" }
tempfile = { workspace = true }
typesec-memory = { path = "../../../typesec/crates/typesec-memory", features = ["conformance"] }
typesec-core = { path = "../../../typesec/crates/typesec-core" }
typesec-rbac = { path = "../../../typesec/crates/typesec-rbac", default-features = false }
