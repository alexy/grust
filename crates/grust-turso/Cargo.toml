[package]
name = "grust-turso"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Turso GraphStore backend for Grust."
keywords.workspace = true
categories.workspace = true

[features]
default = []
sync = ["turso/sync"]

[dependencies]
async-trait = { workspace = true }
grust-core = { version = "0.12.0", path = "../grust-core" }
grust-sql-core = { version = "0.12.0", path = "../grust-sql-core" }
serde_json = { workspace = true }
turso = { workspace = true, default-features = false }
grust-cypher = { version = "0.12.0", path = "../grust-cypher" }

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = { workspace = true }
tokio = { workspace = true }
