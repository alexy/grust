services:
  falkor:
    image: ${FALKOR_IMAGE:-falkordb/falkordb:v4.20.4}
    ports:
      - "6379:6379"
      - "3000:3000"

  surreal:
    image: ${SURREAL_IMAGE:-surrealdb/surrealdb:v3.2.4}
    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - root
      - memory
    ports:
      - "8000:8000"

  pggraph:
    image: ${PGGRAPH_IMAGE:-ghcr.io/evokoa/pggraph:1.2.0}
    environment:
      POSTGRES_USER: ${PGGRAPH_USER:-postgres}
      POSTGRES_PASSWORD: ${PGGRAPH_PASSWORD:-postgres}
      POSTGRES_DB: ${PGGRAPH_DB:-graph}
    ports:
      - "${PGGRAPH_PORT:-55432}:5432"
