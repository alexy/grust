name: grust-lsqb

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: grust
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grust"]
      interval: 1s
      timeout: 3s
      retries: 30
    shm_size: 512mb

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/lsqb/Dockerfile
      args:
        GRUST_SOURCE_REVISION: ${GRUST_SOURCE_REVISION:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BENCHMARK_IMAGE: grust-lsqb:local
      CONTAINER_ARCH: ${BENCHMARK_CONTAINER_ARCH:-unknown}
      CONTAINER_OS: linux
      DOCKER_CPUS: ${BENCHMARK_DOCKER_CPUS:-unknown}
      DOCKER_ENGINE_VERSION: ${BENCHMARK_DOCKER_ENGINE_VERSION:-unknown}
      DOCKER_MEMORY_BYTES: ${BENCHMARK_DOCKER_MEMORY_BYTES:-unknown}
      POSTGRES_URL: host=postgres user=postgres password=postgres dbname=grust
      POSTGRES_IMAGE: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    volumes:
      - ./out:/out
