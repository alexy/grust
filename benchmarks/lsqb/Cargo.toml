[package]
name = "grust-lsqb-runner"
version = "0.13.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
falkor = ["dep:grust-falkor", "dep:redis"]
helix = ["dep:grust-helix"]
ladybug = ["dep:grust-ladybug"]
lancedb = ["dep:grust-lancedb", "dep:tempfile"]
pggraph = ["dep:grust-pggraph"]
postgres-pgq = ["dep:grust-postgres-pgq"]
sail = ["dep:grust-sail"]
neo4j-native = ["dep:neo4rs"]
surreal = ["dep:grust-surreal"]
full-backends = [
    "falkor",
    "helix",
    "ladybug",
    "lancedb",
    "pggraph",
    "postgres-pgq",
    "sail",
    "surreal",
]

[dependencies]
grust-core = { path = "../../crates/grust-core" }
grust-cypher = { path = "../../crates/grust-cypher" }
grust-falkor = { path = "../../crates/grust-falkor", optional = true }
grust-helix = { path = "../../crates/grust-helix", optional = true }
grust-ladybug = { path = "../../crates/grust-ladybug", optional = true }
grust-lancedb = { path = "../../crates/grust-lancedb", optional = true }
grust-memory = { path = "../../crates/grust-memory" }
grust-postgres-core = { path = "../../crates/grust-postgres-core" }
grust-postgres-pgq = { path = "../../crates/grust-postgres-pgq", optional = true }
grust-pggraph = { path = "../../crates/grust-pggraph", optional = true }
grust-sail = { path = "../../crates/grust-sail", optional = true }
grust-surreal = { path = "../../crates/grust-surreal", optional = true }
grust-turso = { path = "../../crates/grust-turso" }
libc = "0.2"
neo4rs = { version = "=0.9.0-rc.10", optional = true }
redis = { version = "1.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = "0.7"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "grust-lsqb-runner"
path = "src/main.rs"

[[bin]]
name = "grust-lsqb-matrix"
path = "src/matrix_main.rs"

[[bin]]
name = "grust-lsqb-neo4j"
path = "src/native_neo4j.rs"
required-features = ["neo4j-native"]
