[workspace]
members = [
    "crates/grust",
    "crates/grust-core",
    "crates/grust-memory",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
futures-executor = "0.3.31"
