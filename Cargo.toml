[workspace]
members = [
    "crates/grust",
    "crates/grust-cocoindex",
    "crates/grust-core",
    "crates/grust-cypher",
    "crates/grust-falkor",
    "crates/grust-helix",
    "crates/grust-ladybug",
    "crates/grust-lancedb",
    "crates/grust-memory",
    "crates/grust-postgres",
    "crates/grust-postgres-core",
    "crates/grust-postgres-pgq",
    "crates/grust-pggraph",
    "crates/grust-sail",
    "crates/grust-sql-core",
    "crates/grust-surreal",
    "crates/grust-turso",
    "examples/beads",
]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/querygraph/grust"
homepage = "https://github.com/querygraph/grust"
keywords = ["graph", "property-graph", "database", "rust"]
categories = ["database", "data-structures"]

[workspace.dependencies]
async-trait = "0.1.89"
helix-db = "=2.0.0"
lbug = "0.17.1"
lancedb = "0.30.0"
redis = "1.2.1"
r2d2 = "0.8.10"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "charset", "gzip", "json"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
surrealdb = { version = "3.1.0-beta.3", default-features = false, features = ["protocol-ws", "rustls"] }
thiserror = "2.0.17"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = { version = "0.7.15", features = ["with-serde_json-1"] }
turso = { version = "0.7.0-pre.10", default-features = false }
url = "2.5.8"
futures-executor = "0.3.31"
garde = "0.23.0"
tempfile = "3.24.0"
zod-rs = { version = "1.0.1", default-features = false }
