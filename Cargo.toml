[workspace]
members = [
    "crates/grust",
    "crates/grust-core",
    "crates/grust-falkor",
    "crates/grust-helix",
    "crates/grust-memory",
    "crates/grust-surreal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
helix-db = "=2.0.0"
redis = "1.2.1"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "charset", "gzip", "json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
surrealdb = { version = "3.1.0-beta.3", default-features = false, features = ["protocol-ws", "rustls"] }
thiserror = "2.0.17"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5.8"
futures-executor = "0.3.31"
